name: checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python compile
        run: python -m compileall -q fishpond bridge
      - name: JS syntax
        run: node --check fishpond/web/js/app.js
      - name: Module index
        run: python fishpond/tools/check_index.py
